<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mochi Settings</title>
<link rel="stylesheet" href="pet.css">
<link rel="stylesheet" href="ui.css">
<style>
  /* Settings: one pane at a time under the window's native toolbar, printed straight on Mochi's paper (no card
     inside the window). Rows sit in soft grouped boxes like a Mac settings pane; the controls are Mochi's. */
  html, body { height: 100%; }
  body { background: #fffaf3; overflow-y: auto; }
  body::-webkit-scrollbar { width: 6px; }
  body::-webkit-scrollbar-thumb { background: #e6d8c9; }
  .page { --ink: #2a1d1a; --paper: #fffaf3; --shade: rgba(42, 29, 26, 0.16); box-sizing: border-box; padding: 14px 22px 22px;
    color: var(--ink); font: 400 17px/1.15 "Jersey 15", ui-monospace, Menlo, monospace; letter-spacing: 0.02em; }

  h2 { margin: 16px 2px 7px; }
  h2:first-child { margin-top: 2px; }
  .cap { margin: -3px 2px 8px; font-size: 14px; color: var(--muted); line-height: 1.1; }
  .group { padding: 2px 12px; background: #fdf5ec; box-shadow: 0 0 0 2px var(--line); }
  .group + .group { margin-top: 12px; }
  .group .set { min-height: 36px; }
  .set .end { display: flex; align-items: center; gap: 8px; flex: none; }
  .set .two { display: flex; flex-direction: column; min-width: 0; line-height: 1.05; padding: 5px 0; }
  .set .two .line { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .set .two .line.wrap { white-space: normal; }
  .set .two .line.ok { color: #3f9a58; }
  .set .two .line.warn { color: #b57d14; }
  .set .two .line.error { color: var(--red); }
  .set .who { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .set.off .who { opacity: 0.55; }
  .set.disabled { opacity: 0.5; pointer-events: none; }
  .note { margin: 8px 2px 0; font-size: 14px; line-height: 1.1; color: #b57d14; }
  .note.error { color: var(--red); }
  .sound { display: flex; align-items: center; gap: 4px; }
  .sound .name { width: 70px; text-align: center; font-size: 15px; }
  .card .pxb.tiny { padding: 1px 6px 2px; font-size: 15px; }
  .seg button:disabled { color: var(--muted); cursor: default; }

  /* where usage shows: two tiles with a little drawing of each */
  .where { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .where button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px 10px; background: #fdf5ec; text-align: center; box-shadow: 0 0 0 2px var(--line); }
  .where button:hover { background: #f6eadc; }
  .where button.on { background: var(--paper); box-shadow: 0 -2px 0 0 var(--orange), 0 2px 0 0 var(--orange), -2px 0 0 0 var(--orange), 2px 0 0 0 var(--orange); }
  .where button:disabled { opacity: 0.45; cursor: default; }
  .where .t { font-size: 18px; }
  .where .d { font-size: 14px; color: var(--muted); line-height: 1.1; }
  .screen { position: relative; width: 84px; height: 50px; background: #3a2c28;
    box-shadow: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink); }
  .screen::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 7px; background: #5c4a44; }
  .screen i { position: absolute; display: block; background: var(--orange); }
  .screen i.badge { top: 1px; right: 6px; width: 10px; height: 5px; background: #fffaf3; }
  .screen i.pill { top: 0; left: 31px; width: 22px; height: 11px; background: #120c0b; }
  .screen i.pill::after { content: ""; position: absolute; left: 8px; top: 7px; width: 6px; height: 2px; background: var(--orange); }

  /* about */
  .about { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 6px 0 4px; }
  .about .stage { width: 160px; height: 96px; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
  .about .stage .critter { margin-bottom: -12px; }
  .about .big { font-size: 30px; margin-top: 6px; }
  .about .muted { font-size: 15px; margin-top: 2px; }
  .about .btns { display: flex; gap: 10px; margin-top: 16px; }
  .about .btns .pxb { padding: 4px 12px 5px; }
</style>
</head>
<body>
<main id="pane" class="card page"></main>
<script src="pet.js"></script>
<script src="icons.js"></script>
<script src="looks.js"></script>
<script src="settings.js"></script>
</body>
</html>
