<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mochi</title>
<link rel="stylesheet" href="pet.css">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; cursor: default; -webkit-user-select: none; user-select: none; }
  #stage { position: relative; width: var(--w, 320px); height: var(--h, 360px); }
  #pet { position: absolute; left: var(--pet-left, 22px); bottom: var(--pet-bottom, 0px); }
  /* above #pet: Mochi's canvas is taller than Mochi, and its empty top would otherwise sit over the bubble's buttons and eat their clicks */
  #bubbleWrap { position: absolute; z-index: 1; left: 0; right: 0; bottom: var(--bubble-above, 150px); display: flex; justify-content: center; pointer-events: none; }
  #bubbleWrap.below { bottom: auto; top: var(--bubble-below, 0px); }
  #bubble { pointer-events: auto; }
  body.menu #bubbleWrap { visibility: hidden; }   /* the panel speaks for Mochi while it's open */
  html.render #stage { width: 276px; height: 204px; }
  html.render #pet { left: 0; bottom: 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="bubbleWrap"><div id="bubble" class="px-bubble" hidden><div class="b-text"></div><div class="b-btns" hidden></div></div></div>
  <div id="pet"></div>
</div>
<script src="pet.js"></script>
<script src="icons.js"></script>
<script src="brain.js"></script>
</body>
</html>
