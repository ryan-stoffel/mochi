<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mochi's panel</title>
<link rel="stylesheet" href="pet.css">
<link rel="stylesheet" href="ui.css">
<style>
  /* Mochi's panel: ui.css's big speech bubble, plus what only this panel has. */
  /* dress up: live critters in a grid */
  .closet { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .closet button { display: flex; flex-direction: column; align-items: center; padding: 2px 0 5px; background: var(--soft); }
  .closet button:hover { background: #efe2d4; }
  .closet button.on { background: var(--paper); box-shadow: 0 -2px 0 0 var(--orange), 0 2px 0 0 var(--orange), -2px 0 0 0 var(--orange), 2px 0 0 0 var(--orange); }
  .closet .stage { width: 69px; height: 46px; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; }
  .closet .stage .critter { margin-bottom: -4px; }
  .closet span { font-size: 14px; color: var(--muted); }
  .closet button.on span { color: var(--ink); }
  .set .dot.done { background: #4fae68; }
  .sess .line.done { color: #3f8f55; }
</style>
</head>
<body>
<div id="wrap">
<div id="card" class="card px-bubble" tabindex="-1">
  <header>
    <div class="who"><div class="name">mochi</div><div class="mood" id="mood"></div></div>
    <button class="ghost" id="eye"></button>
  </header>
  <nav id="tabs"></nav>
  <div id="body"></div>
</div>
</div>
<script src="pet.js"></script>
<script src="icons.js"></script>
<script src="looks.js"></script>
<script src="panel.js"></script>
</body>
</html>
